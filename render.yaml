databases:
  - name: scholarsync-db
    plan: free
    databaseName: scholarsync
    user: scholarsync

services:
  - type: web
    name: scholarsync
    runtime: python
    plan: free
    buildCommand: |
      npm --prefix frontend ci && npm --prefix frontend run build
      pip install --upgrade pip && pip install -r backend/requirements.txt
    startCommand: |
      cd backend && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: NODE_VERSION
        value: 22.12.0
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: scholarsync-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: FRONTEND_ORIGIN
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_INITIAL_PASSWORD
        sync: false

  - type: cron
    name: scholarsync-official-source-sync
    runtime: python
    plan: starter
    schedule: "0 */12 * * *"
    buildCommand: pip install --upgrade pip && pip install -r backend/requirements.txt
    startCommand: cd backend && python -m app.cli sync-sources
    envVars:
      - key: APP_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: SECRET_KEY
        fromService:
          type: web
          name: scholarsync
          envVarKey: SECRET_KEY
      - key: DATABASE_URL
        fromDatabase:
          name: scholarsync-db
          property: connectionString
