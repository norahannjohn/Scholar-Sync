[project]
name = "scholarsync-backend"
version = "0.1.0"
description = "ScholarSync — Agentic AI Scholarship Discovery & Deterministic Eligibility Backend"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]
